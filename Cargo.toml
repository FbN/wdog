[package]
name = "wdog"
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
description = "Watchdog runner for long shell commands, built for coding agents"
license = "MIT"
authors = ["Fabiano Taioli <ftaioli@gmail.com>"]
repository = "https://github.com/FbN/wdog"
readme = "README.md"
keywords = ["watchdog", "cli", "agents", "process", "monitor"]
categories = ["command-line-utilities", "development-tools"]
include = ["/src", "/README.md", "/LICENSE"]

# cargo binstall: static musl binary (with https) from the GitHub release
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/wdog-v{ version }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"
disabled-strategies = ["quick-install"]

[[bin]]
name = "wdog"
path = "src/main.rs"

[features]
default = []
# https:// for `wait --url` (rustls + bundled webpki roots; no system OpenSSL)
https = ["ureq/rustls"]

[dependencies]
anyhow = "1"
async-executor = "1.14"
async-io = "2.6"
async-signal = "0.2"
clap = { version = "4.6", features = ["derive"] }
fastrand = "2"
futures-lite = "2"
nix = { version = "0.31", features = ["process", "signal", "fs", "term", "ioctl", "user"] }
ratatui = "0.29.0"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
ureq = { version = "3", default-features = false }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
